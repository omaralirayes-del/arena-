      {q:'أول دولة استضافت كأس العالم؟',opts:['البرازيل','أوروغواي','إيطاليا','فرنسا'],ans:1,cat:'مونديال'},
      {q:'الأرجنتين فازت بكأس العالم 2022 أمام من في النهائي؟',opts:['البرازيل','ألمانيا','فرنسا','كرواتيا'],ans:2,cat:'مونديال'},
    ]
  },
  {
    id:'ch3', title:'تحدي الدوريات', category:'أندية', emoji:'🏅',
    desc:'5 أسئلة عن أشهر الدوريات والأندية العالمية',
    questions:[
      {q:'من هو الناد الأكثر تتويجاً بدوري أبطال أوروبا؟',opts:['برشلونة','ليفربول','ريال مدريد','ميلان'],ans:2,cat:'أندية'},
      {q:'دوري الدرجة الأولى الإنجليزي اسمه الرسمي؟',opts:['الدوري الممتاز','الدوري الأول','البريميرليغ','دوري الأبطال'],ans:2,cat:'أندية'},
      {q:'ناد الكلاسيكو الأبرز في إسبانيا بين؟',opts:['ريال مدريد وأتليتيكو','برشلونة وفالنسيا','ريال مدريد وبرشلونة','إشبيلية وريال مدريد'],ans:2,cat:'أندية'},
      {q:'من أكثر الأندية تتويجاً في الدوري الإيطالي؟',opts:['إنتر ميلان','روما','يوفنتوس','ميلان'],ans:2,cat:'أندية'},
      {q:'أي ناد يُعرف بـ "الشياطين الحمر"؟',opts:['ليفربول','مانشستر يونايتد','آرسنال','تشيلسي'],ans:1,cat:'أندية'},
    ]
  },
  {
    id:'ch4', title:'تحدي العرب', category:'عرب', emoji:'🌙',
    desc:'5 أسئلة عن كرة القدم العربية والمنتخبات العربية',
    questions:[
      {q:'أول منتخب عربي يصل لربع نهائي كأس العالم؟',opts:['مصر','تونس','المغرب','الجزائر'],ans:2,cat:'عرب'},
      {q:'كم مرة فاز المنتخب المصري بكأس الأمم الأفريقية؟',opts:['5','6','7','8'],ans:2,cat:'عرب'},
      {q:'أي لاعب عربي لعب في برشلونة ويوفنتوس؟',opts:['صلاح','بن يدر','مهيدي','زيدان'],ans:3,cat:'عرب'},
      {q:'مصر ظهرت في كأس العالم كام مرة حتى 2024؟',opts:['2','3','4','5'],ans:1,cat:'عرب'},
      {q:'أي دولة عربية فازت بكأس الخليج أكثر مرة؟',opts:['السعودية','الكويت','العراق','قطر'],ans:1,cat:'عرب'},
    ]
  },
  {
    id:'ch5', title:'تحدي القوانين', category:'قوانين', emoji:'📋',
    desc:'5 أسئلة عن قوانين كرة القدم والملعب',
    questions:[
      {q:'كم لاعباً في كل فريق أثناء المباراة؟',opts:['9','10','11','12'],ans:2,cat:'قوانين'},
      {q:'ما مدة الشوط الواحد في كرة القدم؟',opts:['40 دقيقة','45 دقيقة','50 دقيقة','60 دقيقة'],ans:1,cat:'قوانين'},
      {q:'كم عرض مرمى كرة القدم؟',opts:['6.32م','7.32م','8.32م','9.32م'],ans:1,cat:'قوانين'},
      {q:'ضربة الجزاء تُنفَّذ من كم متر؟',opts:['9م','10م','11م','12م'],ans:2,cat:'قوانين'},
      {q:'الكرت الأحمر يعني؟',opts:['إنذار','طرد مباشر','5 دقائق إيقاف','استبدال إجباري'],ans:1,cat:'قوانين'},
    ]
  },
];

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
const ST={
  playerName:'', roomId:null, challengeId:null,
  role:null, // 'p1' | 'p2'
  myScore:0, oppScore:0,
  qIdx:0, answered:false,
  myAnswers:[], // {correct,chosen,correct_idx}
  timerInt:null, pollInt:null, chatPollInt:null,
  lastChatId:0, chatHistory:[],
};

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
async function init(){
  renderChallenges();
  updateLive();
  setInterval(updateLive,15000);
}

function renderChallenges(){
  const list=document.getElementById('challenges-list');
  list.innerHTML=CHALLENGES.map(c=>`
    <div class="ch-card" onclick="joinChallenge('${c.id}')">
      <div class="ch-meta">
        <div class="ch-num">${c.emoji} ${c.category}</div>
        <div class="ch-badge waiting" id="badge-${c.id}">جاري التحميل...</div>
      </div>
      <div class="ch-title">${c.title}</div>
      <div class="ch-desc">${c.desc}</div>
      <div class="ch-footer">
        <span>5 أسئلة — اختيار من متعدد</span>
        <span style="color:var(--gold)">انضم ←</span>
      </div>
    </div>
  `).join('');
  refreshBadges();
}

async function refreshBadges(){
  for(const c of CHALLENGES){
    const rooms=await sbGet('rooms',`challenge_id=eq.${c.id}&status=eq.waiting&select=id`);
    const el=document.getElementById('badge-'+c.id);
    if(!el)continue;
    if(rooms&&rooms.length){el.textContent=`${rooms.length} غرفة متاحة`;el.className='ch-badge waiting';}
    else{el.textContent='ابدأ غرفة جديدة';el.className='ch-badge';}
  }
}

async function updateLive(){
  const rooms=await sbGet('rooms','status=eq.playing&select=id');
  const entries=await sbGet('results','select=id');
  document.getElementById('live-txt').textContent=`${rooms?rooms.length:0} مباراة جارية · ${entries?entries.length:0} مباراة لُعبت`;
}

// ══════════════════════════════════════════════
//  JOIN
// ══════════════════════════════════════════════
async function joinChallenge(cid){
  const name=document.getElementById('player-name-inp').value.trim()||ST.playerName;
  if(!name){toast('اكتب اسمك أولاً!','err');document.getElementById('player-name-inp').focus();return;}
  ST.playerName=name;ST.challengeId=cid;

  // find waiting room
  const rooms=await sbGet('rooms',`challenge_id=eq.${cid}&status=eq.waiting&select=*&order=created_at.asc&limit=1`);
  let room=rooms&&rooms[0];

  if(room&&room.p1_name!==name){
    // join as p2
    await sbPatch('rooms',`id=eq.${room.id}`,{p2_name:name,status:'ready'});
    ST.roomId=room.id;ST.role='p2';
  } else {
    // create room
    const res=await sbPost('rooms',{challenge_id:cid,p1_name:name,p2_name:null,status:'waiting',p1_ready:false,p2_ready:false,current_q:0,p1_score:0,p2_score:0});
    room=res&&res[0];
    if(!room){toast('خطأ في الاتصال','err');return;}
    ST.roomId=room.id;ST.role='p1';
  }

  showWaiting();
  startPollWaiting();
}

// ══════════════════════════════════════════════
//  WAITING ROOM
// ══════════════════════════════════════════════
function showWaiting(){
  showScreen('waiting');
  const ch=CHALLENGES.find(c=>c.id===ST.challengeId);
  document.getElementById('w-ch-cat').textContent=ch.emoji+' '+ch.category;
  document.getElementById('w-ch-title').textContent=ch.title;
  document.getElementById('w-ch-desc').textContent=ch.desc;
  document.getElementById('ready-btn').disabled=true;
  renderWaitingSlots(null);
}

function renderWaitingSlots(room){
  const p1n=room?room.p1_name:ST.role==='p1'?ST.playerName:'...';
  const p2n=room?room.p2_name:(ST.role==='p2'?ST.playerName:null);
  const s1=document.getElementById('slot-p1');
  const s2=document.getElementById('slot-p2');
  document.getElementById('p1-name').textContent=p1n||'في الانتظار...';
  document.getElementById('p2-name').textContent=p2n||'في الانتظار...';
  if(p1n)s1.classList.add('filled'); else s1.classList.remove('filled');
  if(p2n)s2.classList.add('filled'); else s2.classList.remove('filled');
  const r1=room&&room.p1_ready,r2=room&&room.p2_ready;
  document.getElementById('p1-status').textContent=p1n?(r1?'✅ جاهز':'⏳ لم يجهز بعد'):'—';
  document.getElementById('p2-status').textContent=p2n?(r2?'✅ جاهز':'⏳ لم يجهز بعد'):'—';
  const myReady=ST.role==='p1'?r1:r2;
  const btn=document.getElementById('ready-btn');
  if(p2n){btn.disabled=myReady;btn.textContent=myReady?'في انتظار المنافس ⏳':'جاهز ✓';}
  else{btn.disabled=true;}
  const info=document.getElementById('w-info');
  if(!p2n)info.textContent='في انتظار لاعب آخر...';
  else if(!r1||!r2)info.textContent='في انتظار الجاهزية من الطرفين...';
  else info.textContent='كلاهما جاهز — تبدأ المباراة!';
}

function startPollWaiting(){
  clearInterval(ST.pollInt);
  ST.pollInt=setInterval(async()=>{
    const rooms=await sbGet('rooms',`id=eq.${ST.roomId}&select=*`);
    const room=rooms&&rooms[0];if(!room)return;
    renderWaitingSlots(room);
    if(room.status==='playing'){clearInterval(ST.pollInt);startQuiz(room);}
  },1500);
}

async function setReady(){
  const field=ST.role==='p1'?'p1_ready':'p2_ready';
  await sbPatch('rooms',`id=eq.${ST.roomId}`,{[field]:true});
  // check if both ready → start
  const rooms=await sbGet('rooms',`id=eq.${ST.roomId}&select=*`);
  const room=rooms&&rooms[0];if(!room)return;
  const bothReady=(ST.role==='p1'?(room.p2_ready):(room.p1_ready))&&true;
  if(bothReady){await sbPatch('rooms',`id=eq.${ST.roomId}`,{status:'playing',current_q:0});}
  document.getElementById('ready-btn').disabled=true;
}

async function leaveRoom(){
  clearInterval(ST.pollInt);
  if(ST.role==='p1')await sbPatch('rooms',`id=eq.${ST.roomId}`,{status:'abandoned'});
  goLobby();
}

// ══════════════════════════════════════════════
//  QUIZ
// ══════════════════════════════════════════════
function startQuiz(room){
  const ch=CHALLENGES.find(c=>c.id===ST.challengeId);
  ST.myScore=0;ST.oppScore=0;ST.qIdx=0;ST.myAnswers=[];
  ST.chatHistory=[];ST.lastChatId=0;
  showScreen('quiz');
  loadQuestion(ch,0);
  startChatPoll();
  startPollScores();
}

function loadQuestion(ch,idx){
  const q=ch.questions[idx];
  ST.answered=false;
  clearInterval(ST.timerInt);
  document.getElementById('q-counter').textContent=`سؤال ${idx+1} / 5`;
  document.getElementById('q-progress').style.width=`${(idx/5)*100}%`;
  document.getElementById('q-cat').textContent=q.cat;
  document.getElementById('q-txt').textContent=q.q;
  const letters=['A','B','C','D'];
  document.getElementById('q-opts').innerHTML=q.opts.map((o,i)=>`
    <button class="opt-btn" onclick="chooseOpt(${i})" id="opt-${i}">
      <span class="opt-letter">${letters[i]}</span>${o}
    </button>`).join('');
  updateScoreChips();
  startTimer(20,q,idx);
}

function startTimer(sec,q,idx){
  let t=sec;
  const bar=document.getElementById('timer-bar');
  const num=document.getElementById('timer-num');
  bar.style.background='var(--green)';
  ST.timerInt=setInterval(()=>{
    t--;
    num.textContent=t;
    bar.style.width=`${(t/sec)*100}%`;
    if(t<=5){num.classList.add('hurry');bar.style.background='var(--red)';}
    else{num.classList.remove('hurry');}
    if(t<=0){clearInterval(ST.timerInt);if(!ST.answered)timeUp(q,idx);}
  },1000);
}

async function chooseOpt(i){
  if(ST.answered)return;
  ST.answered=true;
  clearInterval(ST.timerInt);
  const ch=CHALLENGES.find(c=>c.id===ST.challengeId);
  const q=ch.questions[ST.qIdx];
  const correct=i===q.ans;
  if(correct){ST.myScore+=20;}
  ST.myAnswers.push({correct,chosen:i,correct_idx:q.ans,q:q.q,opts:q.opts});

  // show feedback
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(b=>b.disabled=true);
  btns[i].classList.add(correct?'correct':'wrong');
  if(!correct)btns[q.ans].classList.add('correct');

  // save score to DB
  const field=ST.role==='p1'?'p1_score':'p2_score';
  await sbPatch('rooms',`id=eq.${ST.roomId}`,{[field]:ST.myScore,current_q:ST.qIdx+1});

  updateScoreChips();
  setTimeout(()=>nextQ(ch),1400);
}

function timeUp(q,idx){
  ST.answered=true;
  ST.myAnswers.push({correct:false,chosen:-1,correct_idx:q.ans,q:q.q,opts:q.opts});
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(b=>b.disabled=true);
  if(btns[q.ans])btns[q.ans].classList.add('correct');
  const ch=CHALLENGES.find(c=>c.id===ST.challengeId);
  setTimeout(()=>nextQ(ch),1200);
}

function nextQ(ch){
  ST.qIdx++;
  if(ST.qIdx>=5){endQuiz();}
  else{loadQuestion(ch,ST.qIdx);}
}

function startPollScores(){
  clearInterval(ST.pollInt);
  ST.pollInt=setInterval(async()=>{
    const rooms=await sbGet('rooms',`id=eq.${ST.roomId}&select=*`);
    const room=rooms&&rooms[0];if(!room)return;
    const oppScore=ST.role==='p1'?room.p2_score:room.p1_score;
    ST.oppScore=oppScore||0;
    updateScoreChips();
  },2000);
}

function updateScoreChips(){
  document.getElementById('my-score-chip').textContent=`أنا: ${ST.myScore}`;
  document.getElementById('opp-score-chip').textContent=`المنافس: ${ST.oppScore}`;
}

// ══════════════════════════════════════════════
//  END
// ══════════════════════════════════════════════
async function endQuiz(){
  clearInterval(ST.timerInt);clearInterval(ST.pollInt);clearInterval(ST.chatPollInt);

  // wait a bit for opponent last score
  await new Promise(r=>setTimeout(r,2000));
  const rooms=await sbGet('rooms',`id=eq.${ST.roomId}&select=*`);
  const room=rooms&&rooms[0];
  const p1s=room?room.p1_score:0, p2s=room?room.p2_score:0;
  const myFinal=ST.role==='p1'?p1s:p2s;
  const oppFinal=ST.role==='p1'?p2s:p1s;
  const oppName=ST.role==='p1'?room.p2_name:room.p1_name;

  // save result
  await sbPost('results',{challenge_id:ST.challengeId,p1_name:room.p1_name,p2_name:room.p2_name,p1_score:p1s,p2_score:p2s,winner:p1s>p2s?room.p1_name:p2s>p1s?room.p2_name:'تعادل'});
  await sbPatch('rooms',`id=eq.${ST.roomId}`,{status:'done'});

  showScreen('result');
  const iWin=myFinal>oppFinal, isDraw=myFinal===oppFinal;
  document.getElementById('res-trophy').textContent=iWin?'🏆':isDraw?'🤝':'😔';
  document.getElementById('res-title').textContent=iWin?'فزت!':isDraw?'تعادل':'خسرت';
  document.getElementById('res-sub').textContent=iWin?'أداء رائع، أنت الأفضل!':isDraw?'مباراة متكافئة!':'حاول مرة أخرى!';
  document.getElementById('res-scores').innerHTML=`
    <div class="result-score-card ${iWin?'winner':''}">
      <div class="rsc-name">${ST.playerName} (أنا)</div>
      <div class="rsc-num ${iWin?'gold':''}">${myFinal}</div>
    </div>
    <div class="result-score-card ${!iWin&&!isDraw?'winner':''}">
      <div class="rsc-name">${oppName||'المنافس'}</div>
      <div class="rsc-num ${!iWin&&!isDraw?'gold':''}">${oppFinal}</div>
    </div>`;
  const rev=document.getElementById('answers-review');
  rev.innerHTML=`<div style="font-size:14px;letter-spacing:2px;color:var(--gold);margin-bottom:14px;text-transform:uppercase">مراجعة إجاباتك</div>`+
    ST.myAnswers.map((a,i)=>`
      <div class="rev-row ${a.correct?'correct-rev':'wrong-rev'}">
        <div class="rev-icon">${a.correct?'✅':'❌'}</div>
        <div>
          <div class="rev-q">${i+1}. ${a.q}</div>
          <div class="rev-a">${a.chosen>=0?'اخترت: '+a.opts[a.chosen]+' — ':'انتهى الوقت — '}الصواب: ${a.opts[a.correct_idx]}</div>
        </div>
      </div>`).join('');
}

// ══════════════════════════════════════════════
//  CHAT
// ══════════════════════════════════════════════
async function sendChat(){
  const inp=document.getElementById('chat-inp');
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';
  await sbPost('chats',{room_id:ST.roomId,author:ST.playerName,body:msg});
  loadChat();
}

async function loadChat(){
  const msgs=await sbGet('chats',`room_id=eq.${ST.roomId}&order=created_at.asc&select=*`);
  if(!msgs||!msgs.length)return;
  const box=document.getElementById('chat-msgs');
  box.innerHTML=msgs.map(m=>`
    <div class="chat-msg">
      <span class="author ${m.author!==ST.playerName?'opp':''}">${m.author}: </span>${m.body}
    </div>`).join('');
  box.scrollTop=box.scrollHeight;
}

function startChatPoll(){
  clearInterval(ST.chatPollInt);
  ST.chatPollInt=setInterval(loadChat,2000);
}

// ══════════════════════════════════════════════
//  LEADERBOARD
// ══════════════════════════════════════════════
async function loadLB(){
  const results=await sbGet('results','select=*&order=created_at.desc&limit=100');
  const players={};
  (results||[]).forEach(r=>{
    [r.p1_name,r.p2_name].forEach((n,idx)=>{
      if(!n)return;
      if(!players[n])players[n]={name:n,wins:0,games:0,totalScore:0};
      players[n].games++;
      players[n].totalScore+=idx===0?r.p1_score:r.p2_score;
      if(r.winner===n)players[n].wins++;
    });
  });
  const sorted=Object.values(players).sort((a,b)=>b.wins-a.wins||b.totalScore-a.totalScore);
  document.getElementById('stat-games').textContent=results?results.length:0;
  document.getElementById('stat-players').textContent=sorted.length;
  const medals=['🥇','🥈','🥉'];
  const ranks=['g','s','b'];
  document.getElementById('lb-list').innerHTML=sorted.length?sorted.map((p,i)=>`
    <div class="lb-row ${i===0?'top':''}">
      <div class="lb-rank ${ranks[i]||''}">${medals[i]||'#'+(i+1)}</div>
      <div class="lb-info">
        <div class="lb-name">${p.name}</div>
        <div class="lb-detail">${p.wins} انتصار · ${p.games} مباراة</div>
      </div>
      <div class="lb-pts">${p.totalScore}</div>
    </div>`).join(''):'<div style="text-align:center;padding:40px;color:var(--muted)">لا توجد نتائج بعد</div>';
}

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════
function showScreen(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
  document.getElementById('screen-'+s).classList.add('on');
}
function switchTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  if(id==='lobby'){showScreen('lobby');}
  else{showScreen('lb');loadLB();}
}
function goLobby(){
  clearInterval(ST.pollInt);clearInterval(ST.chatPollInt);clearInterval(ST.timerInt);
  ST.roomId=null;ST.role=null;ST.qIdx=0;ST.myScore=0;ST.oppScore=0;
  showScreen('lobby');refreshBadges();
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.tab')[0].classList.add('on');
}
function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type} show`;
  setTimeout(()=>t.classList.remove('show'),3000);
}

init();
</script>
